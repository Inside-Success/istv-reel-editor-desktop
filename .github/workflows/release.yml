name: Release desktop build

# Runs when a version tag (v0.1.9, ...) is pushed, or manually from Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  prepare:
    # Create the draft release ONCE, before any electron-builder runs.
    #
    # This exists because electron-builder starts one GitHub publisher per
    # target type and runs them concurrently WITHIN a single job — the mac job
    # has one for DMG and one for ZIP. When the release does not exist yet both
    # take the "create it" branch, and GitHub happily honours both: two separate
    # releases end up sharing one tag.
    #
    # That is exactly how v0.1.9 shipped broken. The mac job logged
    # `creating GitHub release reason=release doesn't exist tag=v0.1.9` twice,
    # 70ms apart. The x64 blockmap landed in the first release, every other mac
    # artifact in the second. The Windows job then found the first and uploaded
    # into it, and the publish job's `gh release edit v0.1.9` — ambiguous with
    # two releases on one tag — resolved to that same first one. Result: users
    # saw a Windows-only v0.1.9 while all four mac artifacts sat invisible in a
    # draft.
    #
    # `max-parallel: 1` could never have fixed this; the race is inside a job,
    # not between jobs. Pre-creating the draft is what actually closes it —
    # every publisher now takes the "release already exists" path and only
    # uploads.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # A manual run has no tag, but electron-builder still publishes to
            # v<package.json version>. Target the same tag it will, or we would
            # pre-create one release and have the build create another.
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — build jobs will upload into it"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$TAG" \
              --generate-notes
          fi

  build:
    # One job per OS, both uploading into the draft `prepare` just made.
    # package.json sets releaseType: "draft" so any publisher that somehow still
    # has to create the release makes a draft rather than going live half-built;
    # the `publish` job below flips the finished draft public exactly once, so
    # users never see a partially-populated release mid-build.
    #
    # max-parallel: 1 is no longer load-bearing now that the draft is
    # pre-created — it is kept only to keep two concurrent uploaders off the
    # same release, which costs a few minutes of wall clock and nothing else.
    #
    # The macOS job builds BOTH arches in one go (mac.target lists x64 and arm64)
    # rather than one job per arch. Two reasons:
    #   - electron-builder writes latest-mac.yml describing only the artifacts
    #     from that run, and each job's upload overwrites the previous one's. Per-
    #     arch jobs therefore leave behind a manifest covering a single arch,
    #     silently breaking electron-updater for the other one.
    #   - The x64 slice cross-builds fine on the Apple Silicon runner, and the
    #     hosted Intel macos-13 runner is retired (its jobs queue forever).
    # The per-arch ffmpeg binary that a both-arches build needs is handled by
    # build/afterPack.js — see the staging step below.
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create/update the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ffmpeg-static resolves ONE binary at install time from npm_config_arch,
      # always written to node_modules/ffmpeg-static/ffmpeg. A checkout can
      # therefore only hold one arch at a time, while a both-arches build needs
      # two. Run the package's own installer once per arch and stash each
      # result; build/afterPack.js copies the matching one into each app bundle
      # as it is packed.
      #
      # Two traps here, both of which silently yield the host arch:
      #   - `npm rebuild ffmpeg-static` does NOT work. It runs install.js, but
      #     the script exits early with "ffmpeg is installed already" whenever
      #     the binary is already on disk, so the arch never changes. Hence the
      #     explicit rm before each run, and calling install.js directly rather
      #     than going through an npm lifecycle that might not forward the env.
      #   - `lipo -archs` reports Mach-O slice names, so the Intel slice comes
      #     back as x86_64, NOT x64. The assertion below accounts for that.
      #
      # Getting this wrong is a crash, not a warning: an Intel ffmpeg inside the
      # arm64 bundle (or vice versa) fails with macOS EBADARCH (-86, "Bad CPU
      # type in executable") the first time the app shells out to ffmpeg. That is
      # what shipped through v0.1.8, because mac.target lists both arches and so
      # overrode the per-job --arm64/--x64 flag. `lipo -archs` is echoed as a
      # receipt that each staged binary really is the arch it claims.
      #
      # ffprobe-static needs no equivalent: it vendors every arch under
      # bin/<platform>/<arch>/ and picks at runtime.
      - name: Stage an ffmpeg binary for each macOS arch
        if: matrix.platform == 'mac'
        env:
          FFMPEG_STAGE_DIR: ${{ runner.temp }}/ffmpeg
        run: |
          mkdir -p "$FFMPEG_STAGE_DIR"
          for arch in x64 arm64; do
            rm -f node_modules/ffmpeg-static/ffmpeg
            ( cd node_modules/ffmpeg-static && npm_config_arch="$arch" node install.js )
            cp node_modules/ffmpeg-static/ffmpeg "$FFMPEG_STAGE_DIR/ffmpeg-$arch"
            got=$(lipo -archs "$FFMPEG_STAGE_DIR/ffmpeg-$arch")
            case "$arch:$got" in
              x64:*x86_64*|arm64:*arm64*) echo "staged $arch ffmpeg -> $got" ;;
              *) echo "::error::staged $arch ffmpeg is [$got], expected $arch"; exit 1 ;;
            esac
          done

      - name: Build and publish ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FFMPEG_STAGE_DIR: ${{ runner.temp }}/ffmpeg
        run: npx electron-builder --${{ matrix.platform }} --publish always

  publish:
    # Flip the fully-populated draft release to public, exactly once, after every
    # OS artifact has been uploaded. Tag pushes only — a workflow_dispatch run has
    # no tag to publish.
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Guard against the failure mode that produced the broken v0.1.9: if a tag
      # somehow carries more than one release, `gh release edit` picks one of
      # them arbitrarily and we would publish a half-empty release again. Fail
      # loudly instead and leave everything drafted for a human to sort out.
      - name: Assert the tag has exactly one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$count" != "1" ]; then
            echo "::error::$count releases carry tag $TAG (expected 1) — refusing to publish"
            exit 1
          fi

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
